spring.application.name=demo

# This file SHADOWS src/main/resources/application.properties for tests, because target/
# test-classes precedes target/classes on the classpath. It exists for one reason: the real
# application imports untracked credential files via
#
#   spring.config.import=optional:file:application-secret.properties[.properties],
#                       optional:file:.env[.properties]
#
# and @SpringBootTest runs a real SpringApplication, so ConfigDataEnvironmentPostProcessor
# does run and the developer's genuine Gmail password WOULD be picked up. ContactMailFailure-
# PageTests would then open real connections to smtp.gmail.com and ContactMailServiceTests'
# success assertions would depend on a live third-party relay. Tests must never send mail.
#
# Shadowing also drops that import line, which is deliberate and safe: with no
# spring.mail.host, JavaMailSender is not created and ContactMailService returns LOGGED, which
# is the branch the page tests already assert. The import itself is still guarded, by reading
# src/main/resources/application.properties straight off disk in
# applicationPropertiesImportsTheUntrackedSecretFileAndTheEnvFile, and the credential wiring it
# feeds is covered by the ApplicationContextRunner tests in ContactMailConfigurationTests,
# which never see this file.
#
# Keep the non-secret transport tuning below in step with the main file.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false

app.contact.to=faleelmr4@gmail.com
app.contact.from=portfolio@localhost
app.contact.subject-prefix=New portfolio message
