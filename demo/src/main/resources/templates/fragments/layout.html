<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!--
  Page shell. Two fragments:
    ~{fragments/layout :: head('title')}   <head> contents
    ~{fragments/layout :: scripts}        script tags
-->

<head th:fragment="head(pageTitle)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle}">Faleel H — Java Developer</title>
  <meta name="description"
        content="Portfolio of Faleel H, a Java developer and BCA graduate building practical web applications with Java, Spring Boot, Spring AI, MySQL, REST APIs, and HTMX.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FAF9F6">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236D28D9'/%3E%3Cstop offset='1' stop-color='%23C85A45'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='21' font-family='Inter,sans-serif' font-size='13' font-weight='700' fill='%23fff' text-anchor='middle'%3EFH%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">

  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>

<body>

<th:block th:fragment="scripts">
  <!--
    htmx is the only script on the page. It is not decoration: the 04 / DIALOGUE form uses it to
    swap the small result fragment in place. There is no site.js — everything the page used to
    do in the browser is now server-rendered markup or plain CSS, so if this fails to load, or
    the visitor blocks it, the form still submits with a normal POST and the whole page works.

    The toast system went with site.js. It duplicated what #contact-result already announced
    through role="status" / role="alert", so removing it removed a redundant second channel
    rather than the only one.
  -->
  <script defer src="https://unpkg.com/htmx.org@2/dist/htmx.min.js"></script>
</th:block>

</body>

</html>
