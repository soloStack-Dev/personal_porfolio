<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- Footer: FH mark + name | nav | copyright, with a circular back-to-top at the far right. -->

<footer th:fragment="siteFooter" class="site-footer">
  <div class="container site-footer__inner">

    <p class="site-footer__brand">
      <span class="brand__mark brand__mark--sm" aria-hidden="true">FH</span>
      <span class="site-footer__name" th:text="${ownerName}">Faleel H</span>
    </p>

    <nav class="site-footer__nav" aria-label="Footer">
      <a href="#top">Home</a>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>

    <p class="site-footer__copy">&copy; <span th:text="${currentYear}">2026</span> <span th:text="${ownerName}">Faleel H</span>. All rights reserved.</p>

    <!--
      An anchor, not a button. It was a <button> plus a scroll listener that only revealed it
      past 320px; an <a href="#top"> does the same job with no script, and the smooth scroll is
      already handled by `html { scroll-behavior: smooth }`, which the reduced-motion block
      switches off. Losing the reveal means it is always visible, which is a fair trade for
      working without JavaScript.
    -->
    <a class="to-top" href="#top" aria-label="Back to top">
      <span th:insert="~{fragments/icon :: icon('arrow-up', 13)}"></span>
    </a>

  </div>
</footer>

</html>
