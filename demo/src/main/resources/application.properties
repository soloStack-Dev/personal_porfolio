spring.application.name=demo

# Mail credentials live in an untracked properties file beside the pom, not here. This file is
# tracked by git and packaged into the jar, and the GitHub repo is public, so a password in
# either place would be published. The [..properties] hint tells Spring to parse it as a
# properties file; `optional:` means a missing file is fine for anyone cloning the repo.
# application-secret.properties holds the values; .env holds the same keys in dotenv form for
# docker compose's env_file, and either one is enough.
spring.config.import=optional:file:application-secret.properties[.properties],optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# Contact form delivery
#
# The form works with no configuration at all: with no spring.mail.host,
# JavaMailSender is not created and ContactMailService logs the enquiry instead
# (the UI then says so honestly rather than claiming the mail was sent).
#
# Secrets do NOT belong in this file. spring.mail.host / port / username /
# password come from the environment — see .env.example, which docker compose
# loads through env_file. Only the non-secret transport tuning lives here.
#
# Everything below is a real Spring Boot 4 property; app.contact.* resolves
# because spring-boot-configuration-processor generates metadata for it.
# ---------------------------------------------------------------------------

# --- SMTP transport (non-secret) -------------------------------------------
# These two need a dotted map key, which an environment variable cannot express:
# SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH does not bind, and it fails silently
# rather than erroring. Verified against spring-boot-mail 4.0.3 metadata, whose
# entire property list is: default-encoding, host, jndi-name, password, port,
# properties, protocol, ssl.bundle, ssl.enabled, test-connection, username.
# Note there is no spring.mail.starttls and no spring.mail.smtp.auth.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.password deliberately absent: this file is tracked by git and packaged into the jar, and the GitHub repo is public. Put the real value in application-secret.properties (untracked).


# Fail fast if the relay is unreachable instead of accepting submissions that
# will silently fail on the first send. Leave false while developing.
spring.mail.test-connection=false

# Where contact-form submissions go.
app.contact.to=faleelmr4@gmail.com
# app.contact.from is deliberately NOT set here. It has to match spring.mail.username or be an
# alias on it, so it belongs beside the credentials in application-secret.properties. Declaring
# it in both places is a trap: the two files disagree, and import precedence then decides which
# Gmail rejects with "550 The specified from address does not match a permitted sender".
app.contact.subject-prefix=New portfolio message
